name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'
        
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip check

      - name: Run validation tests
        run: python -m pytest -q test_score_churn.py
  
  integration-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: churn_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d churn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-test-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq5
          python -m pip install -r requirements-lock.txt

      - name: Run PostgreSQL integration tests
        run: python -m pytest -q test_churn_integration.py

  docker-smoke-test:
    name: Docker build and startup
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build scoring image
        run: docker build -t customer-churn-scorer:ci .

      - name: Check scorer starts
        run: docker run --rm customer-churn-scorer:ci --help
